name: 🚀 Release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '18'

jobs:
  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 🏗️ Build project
        run: npm run build

      - name: 📦 Create distribution package
        run: |
          mkdir -p dist-package
          cp -r dist package.json README.md LICENSE CHANGELOG.md dist-package/
          cd dist-package && npm pack

      - name: 📋 Generate changelog
        id: changelog
        run: |
          # Extract changelog for this version
          VERSION=${GITHUB_REF#refs/tags/v}
          awk "/## \[${VERSION}\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md > release-notes.md
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: 🏷️ Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Trip Planner Backend v${{ steps.changelog.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false

      - name: 📦 Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist-package/trip-planner-backend-${{ steps.changelog.outputs.version }}.tgz
          asset_name: trip-planner-backend-${{ steps.changelog.outputs.version }}.tgz
          asset_content_type: application/gzip

      - name: 🐳 Build and push Docker image with version tag
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/trip-planner-backend:${{ steps.changelog.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/trip-planner-backend:latest

  publish-npm:
    name: 📦 Publish to NPM
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 📦 Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-release:
    name: 📢 Notify Release
    runs-on: ubuntu-latest
    needs: [release, publish-npm]
    if: always()
    
    steps:
      - name: 📢 Notify Slack about release
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#releases'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            🚀 New release published!
            Version: ${{ github.ref }}
            Status: ${{ job.status }}

      - name: 📧 Send email notification
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 Trip Planner Backend - New Release ${{ github.ref }}"
          to: team@tripplanner.com
          from: noreply@tripplanner.com
          body: |
            A new version of Trip Planner Backend has been released!
            
            Version: ${{ github.ref }}
            Repository: ${{ github.repository }}
            
            Check the release notes: https://github.com/${{ github.repository }}/releases/latest