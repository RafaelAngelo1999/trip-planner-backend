name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  test-and-build:
    name: 🧪 Test & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: ✨ Run linter
        run: npm run lint

      - name: 🏗️ Build TypeScript
        run: npm run build

      - name: 🗄️ Setup Database
        run: |
          npm run db:generate
          npm run db:push

      - name: 🧪 Run tests
        run: npm test

      - name: 🔍 Security audit
        run: npm audit --audit-level moderate

      - name: ✅ All checks passed
        run: echo "🎉 All tests and checks passed successfully!"